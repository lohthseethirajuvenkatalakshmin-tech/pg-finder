<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">PG room interior</title>
  <desc id="desc">A simple shared PG room with a bed, study desk, window, and warm natural light.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f9f5ed"/>
      <stop offset="100%" stop-color="#efe7d9"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f2ea"/>
      <stop offset="100%" stop-color="#e9ddd0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#d8c5a9"/>
      <stop offset="100%" stop-color="#c7b08d"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dbeefe"/>
      <stop offset="100%" stop-color="#a9cfe9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity="0.18" flood-color="#4a3a35"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
